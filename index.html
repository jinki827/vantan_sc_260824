<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>放課後予定共有アプリ</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        "Hiragino Kaku Gothic ProN",
        "Yu Gothic",
        sans-serif;

      background: #f5f7fb;
      color: #333;
    }

    /* ヘッダー */
    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 24px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 22px;
      font-weight: bold;
      color: #4f6bed;
    }

    .header-right {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      cursor: pointer;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 14px;
    }

    .today-btn {
      background: #eef2ff;
      color: #4f6bed;
    }

    .add-btn {
      background: #4f6bed;
      color: white;
    }

    /* メイン */
    .container {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 20px;
    }

    /* カレンダー全体を包むカード型コンテナ */
    .calendar-wrapper {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    /* カレンダーヘッダー */
    .calendar-header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #e5e7eb;
    }

    .month-title {
      font-size: 24px;
      font-weight: bold;
    }

    .month-buttons {
      display: flex;
      gap: 8px;
    }

    .month-buttons button {
      background: #f1f3f7;
    }

    /* 曜日 */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #fafafa;
      border-bottom: 1px solid #e5e7eb;
    }

    .weekday {
      text-align: center;
      padding: 12px 5px;
      font-weight: bold;
      color: #777;
      border-right: 1px solid #e5e7eb;
    }
    
    .weekday:last-child {
      border-right: none;
    }

    /* カレンダー */
    .calendar {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: white;
    }

    .day {
      min-height: 130px;
      padding: 8px;

      border-right: 1px solid #e5e7eb;
      border-bottom: 1px solid #e5e7eb;

      cursor: pointer;
      transition: 0.2s;

      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    /* 7列目（土曜日）の右端枠線を消してズレを解消 */
    .day:nth-child(7n) {
      border-right: none;
    }

    .day:hover {
      background: #f7f8ff;
    }

    .day.empty {
      background: #fafafa;
      cursor: default;
    }

    .day-number {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 4px;
    }

    .today {
      background: #f0f4ff;
    }

    .today .day-number {
      color: #4f6bed;
    }

    /* 予定アイテム */
    .event-item {
      display: flex;
      align-items: center;
      gap: 6px;
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .event-item:hover {
      background: #f0fdf4;
      border-color: #bbf7d0;
    }

    .event-mark {
      font-size: 16px;
      font-weight: bold;
    }

    .mark-my-recruiting { color: #16a34a; } /* 緑の◎ */
    .mark-other-recruiting { color: #9ca3af; } /* グレーの◎ */
    .mark-unavailable { color: #dc2626; } /* 赤の× */

    .event-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: bold;
    }
    .event-owner {
      color: #6b7280;
      font-weight: normal;
      margin-right: 4px;
    }

    /* モーダル */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: white;
      width: 100%;
      max-width: 450px;
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal h2 {
      margin-top: 0;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
    }

    .form-group input[readonly],
    .form-group textarea[readonly] {
      background-color: #f9fafb;
      cursor: not-allowed;
    }

    .form-group textarea {
      height: 80px;
      resize: vertical;
    }

    /* トグルスイッチのスタイル */
    .toggle-switch {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      margin-bottom: 5px;
    }

    .toggle-switch.disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .toggle-switch input[type="checkbox"] {
      display: none;
    }

    .toggle-slider {
      width: 44px;
      height: 24px;
      background-color: #ccc;
      border-radius: 24px;
      position: relative;
      transition: 0.3s;
    }

    .toggle-slider::before {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background-color: white;
      border-radius: 50%;
      top: 2px;
      left: 2px;
      transition: 0.3s;
    }

    .toggle-switch input[type="checkbox"]:checked + .toggle-slider {
      background-color: #16a34a;
    }

    .toggle-switch input[type="checkbox"]:checked + .toggle-slider::before {
      transform: translateX(20px);
    }

    .toggle-label {
      font-size: 14px;
      font-weight: normal;
    }

    /* 参加メンバーリスト */
    .members-list {
      margin: 0;
      padding: 10px 15px;
      background: #f3f4f6;
      border-radius: 8px;
      list-style-type: none;
      font-size: 14px;
    }
    .members-list li {
      padding: 4px 0;
      border-bottom: 1px solid #e5e7eb;
    }
    .members-list li:last-child {
      border-bottom: none;
    }

    /* 参加アクションエリア */
    .join-area {
      background: #f0fdf4;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #bbf7d0;
      margin-bottom: 15px;
    }
    .join-flex {
      display: flex;
      gap: 10px;
    }
    .join-btn {
      background: #16a34a;
      color: white;
      white-space: nowrap;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .cancel-btn { background: #eee; }
    .save-btn { background: #4f6bed; color: white; }
    .delete-btn { margin-right: auto; background: #fee2e2; color: #dc2626; }

    /* 説明 */
    .legend {
      background: white;
      margin-top: 15px;
      padding: 15px 20px;
      border-radius: 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      font-size: 14px;
    }
    .legend span {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    /* スマホ */
    @media (max-width: 600px) {
      header { padding: 12px 15px; }
      .logo { font-size: 18px; }
      .container { margin: 15px auto; padding: 0 8px; }
      .calendar-header { padding: 15px; }
      .month-title { font-size: 18px; }
      .day { min-height: 90px; padding: 4px; }
      .weekday { font-size: 11px; padding: 8px 2px; }
      .legend { font-size: 12px; gap: 15px; }
      
      .event-item {
        padding: 4px;
        font-size: 10px;
        gap: 3px;
      }
      .event-mark { font-size: 14px; }
    }
  </style>
</head>

<body>

  <header>
    <div class="logo">📚 放課後予定共有</div>
    <div class="header-right">
      <button class="today-btn" onclick="goToday()">今日</button>
      <button class="add-btn" onclick="openAddModal()">＋予定を追加</button>
    </div>
  </header>

  <main class="container">
    <div class="calendar-wrapper">
      <div class="calendar-header">
        <div class="month-title" id="monthTitle"></div>
        <div class="month-buttons">
          <button onclick="previousMonth()">‹</button>
          <button onclick="nextMonth()">›</button>
        </div>
      </div>

      <div class="weekdays">
        <div class="weekday">日</div>
        <div class="weekday">月</div>
        <div class="weekday">火</div>
        <div class="weekday">水</div>
        <div class="weekday">木</div>
        <div class="weekday">金</div>
        <div class="weekday">土</div>
      </div>

      <div class="calendar" id="calendar"></div>
    </div>

    <div class="legend">
      <span><strong class="mark-my-recruiting">◎</strong> 自分の予定・参加中</span>
      <span><strong class="mark-other-recruiting">◎</strong> 他の人が募集中</span>
      <span><strong class="mark-unavailable">×</strong> 空いていない</span>
    </div>
  </main>

  <!-- モーダル -->
  <div class="modal-overlay" id="modal" onclick="handleModalOverlayClick(event)">
    <div class="modal">
      <h2 id="modalTitle">放課後の予定</h2>

      <div class="form-group">
        <label>日付</label>
        <input type="text" id="dateInput" readonly>
      </div>

      <!-- 募集状態のトグル -->
      <div class="form-group" style="margin-bottom: 20px;">
        <label>募集状況</label>
        <label class="toggle-switch" id="recruitingToggleWrap">
          <input type="checkbox" id="recruitingInput" checked>
          <div class="toggle-slider"></div>
          <span class="toggle-label" id="recruitingLabel">募集中 (◎)</span>
        </label>
      </div>

      <div class="form-group">
        <label>予定</label>
        <input type="text" id="eventInput" placeholder="例：部活、友達と遊ぶ">
      </div>

      <div class="form-group">
        <label>場所</label>
        <input type="text" id="placeInput" placeholder="例：学校、渋谷駅">
      </div>

      <div class="form-group">
        <label>メモ</label>
        <textarea id="memoInput" placeholder="自由にメモできます"></textarea>
      </div>

      <!-- 参加メンバー表示欄 -->
      <div class="form-group" id="membersGroup" style="display: none;">
        <label>参加メンバー</label>
        <ul class="members-list" id="membersList"></ul>
      </div>

      <!-- 他人の予定への参加エリア -->
      <div class="join-area" id="joinGroup" style="display: none;">
        <label style="font-weight: bold; margin-bottom: 8px; display: block; font-size: 13px;">この予定に参加する</label>
        <div class="join-flex">
          <input type="text" id="joinNameInput" placeholder="あなたの名前を入力">
          <button class="join-btn" onclick="joinEvent()">参加</button>
        </div>
      </div>

      <div class="modal-buttons">
        <button class="delete-btn" id="deleteBtn" onclick="deleteEvent()">削除</button>
        <button class="cancel-btn" onclick="closeModal()">キャンセル</button>
        <button class="save-btn" id="saveBtn" onclick="saveEvent()">保存</button>
      </div>
    </div>
  </div>


  <script>
    /* =========================
       データ初期化・管理
    ========================= */
    const STORAGE_KEY = "afterSchoolEvents_v3";
    let events = {};
    let currentDate = new Date();
    let selectedDate = null;
    let currentEventId = null;

    function initData() {
      const data = localStorage.getItem(STORAGE_KEY);
      if (data) {
        events = JSON.parse(data);
      } else {
        const today = new Date();
        const y = today.getFullYear();
        const m = today.getMonth();
        const d = today.getDate();

        const getOffsetDate = (offset) => formatDate(new Date(y, m, d + offset));

        const dummyList = [
          { offset: 1, owner: "田中", event: "駅前でカラオケ", place: "カラオケ館", memo: "みんなで歌おう！途中参加もOK。", isRecruiting: true },
          { offset: 2, owner: "田中", event: "ボウリング勝負", place: "ラウンドワン", memo: "2ゲームやります！初心者大歓迎", isRecruiting: true },
          { offset: 5, owner: "田中", event: "カフェで雑談", place: "コメダ珈琲", memo: "新作スイーツを食べに行きます", isRecruiting: true },
          { offset: 8, owner: "田中", event: "音ゲー対戦", place: "ゲームセンター", memo: "放課後すぐ集合で！", isRecruiting: true },
          { offset: 12, owner: "田中", event: "公園でサッカー", place: "代々木公園", memo: "動ける服で来てね", isRecruiting: true },

          { offset: 3, owner: "佐藤", event: "テスト勉強", place: "市立図書館", memo: "静かに勉強します。教え合いましょう。", isRecruiting: true },
          { offset: 4, owner: "佐藤", event: "映画鑑賞", place: "TOHOシネマズ", memo: "話題のアニメ映画を見に行きます", isRecruiting: true },
          { offset: 7, owner: "佐藤", event: "服の買い物", place: "ショッピングモール", memo: "春服を探しに行きます", isRecruiting: true },
          { offset: 10, owner: "佐藤", event: "ファミレスで課題", place: "サイゼリヤ", memo: "ドリンクバーで粘ります", isRecruiting: true },
          { offset: 14, owner: "佐藤", event: "ボードゲーム会", place: "レンタルスペース", memo: "いろいろ持っていきます", isRecruiting: true }
        ];

        events = {};

        dummyList.forEach(item => {
          const dateKey = getOffsetDate(item.offset);
          if (!events[dateKey]) {
            events[dateKey] = [];
          }

          events[dateKey].push({
            id: generateId(),
            owner: item.owner,
            event: item.event,
            place: item.place,
            memo: item.memo,
            isRecruiting: item.isRecruiting,
            members: [item.owner],
            hasJoined: false
          });
        });

        saveData();
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
    }

    function generateId() {
      return Math.random().toString(36).substr(2, 9);
    }

    /* =========================
       カレンダー表示
    ========================= */
    function renderCalendar() {
      const calendar = document.getElementById("calendar");
      calendar.innerHTML = "";

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      document.getElementById("monthTitle").textContent = `${year}年${month + 1}月`;

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      for (let i = 0; i < firstDay; i++) {
        const empty = document.createElement("div");
        empty.className = "day empty";
        calendar.appendChild(empty);
      }

      for (let date = 1; date <= lastDate; date++) {
        const day = document.createElement("div");
        day.className = "day";

        const dateKey = formatDate(new Date(year, month, date));
        const isToday = dateKey === formatDate(new Date());
        if (isToday) day.classList.add("today");

        day.onclick = function (e) {
          if (e.target.closest('.event-item')) return;
          openModal(dateKey, null);
        };

        const dayNumber = document.createElement("div");
        dayNumber.className = "day-number";
        dayNumber.textContent = date;
        day.appendChild(dayNumber);

        const dayEvents = events[dateKey] || [];
        dayEvents.forEach(evt => {
          const item = document.createElement("div");
          item.className = "event-item";

          const mark = document.createElement("span");
          mark.className = "event-mark";

          if (evt.isRecruiting) {
            mark.textContent = "◎";
            if (evt.owner === "自分" || evt.hasJoined) {
              mark.classList.add("mark-my-recruiting");
            } else {
              mark.classList.add("mark-other-recruiting");
            }
          } else {
            mark.textContent = "×";
            mark.classList.add("mark-unavailable");
          }

          const textSpan = document.createElement("span");
          textSpan.className = "event-text";
          textSpan.innerHTML = `<span class="event-owner">${evt.owner}</span>${evt.event}`;

          item.appendChild(mark);
          item.appendChild(textSpan);

          item.onclick = function(e) {
            e.stopPropagation();
            openModal(dateKey, evt.id);
          };

          day.appendChild(item);
        });

        calendar.appendChild(day);
      }
    }

    function formatDate(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function previousMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    }

    function goToday() {
      currentDate = new Date();
      renderCalendar();
    }

    /* =========================
       モーダル制御
    ========================= */
    document.getElementById("recruitingInput").addEventListener("change", updateRecruitingLabel);

    function updateRecruitingLabel() {
      const isChecked = document.getElementById("recruitingInput").checked;
      const label = document.getElementById("recruitingLabel");
      label.textContent = isChecked ? "募集中 (◎)" : "自分の予定が空いていない (×)";
    }

    function openModal(dateKey, eventId) {
      selectedDate = dateKey;
      currentEventId = eventId;
      document.getElementById("dateInput").value = dateKey;

      const dayEvents = events[dateKey] || [];
      const evt = dayEvents.find(e => e.id === eventId);

      const els = {
        event: document.getElementById("eventInput"),
        place: document.getElementById("placeInput"),
        memo: document.getElementById("memoInput"),
        recruiting: document.getElementById("recruitingInput"),
        toggleWrap: document.getElementById("recruitingToggleWrap"),
        saveBtn: document.getElementById("saveBtn"),
        deleteBtn: document.getElementById("deleteBtn"),
        membersGroup: document.getElementById("membersGroup"),
        joinGroup: document.getElementById("joinGroup"),
        title: document.getElementById("modalTitle")
      };

      els.event.readOnly = false;
      els.place.readOnly = false;
      els.memo.readOnly = false;
      els.recruiting.disabled = false;
      els.toggleWrap.classList.remove("disabled");
      els.saveBtn.style.display = "block";
      els.deleteBtn.style.display = "none";
      els.membersGroup.style.display = "none";
      els.joinGroup.style.display = "none";
      els.title.textContent = "放課後の予定";

      if (evt) {
        els.event.value = evt.event || "";
        els.place.value = evt.place || "";
        els.memo.value = evt.memo || "";
        els.recruiting.checked = evt.isRecruiting;

        els.membersGroup.style.display = "block";
        const membersList = document.getElementById("membersList");
        membersList.innerHTML = "";
        evt.members.forEach(member => {
          const li = document.createElement("li");
          li.textContent = member;
          membersList.appendChild(li);
        });

        if (evt.owner === "自分") {
          els.deleteBtn.style.display = "block";
          els.title.textContent = "自分の予定を編集";
        } else {
          els.title.textContent = `${evt.owner} さんの予定`;
          els.event.readOnly = true;
          els.place.readOnly = true;
          els.memo.readOnly = true;
          els.recruiting.disabled = true;
          els.toggleWrap.classList.add("disabled");
          els.saveBtn.style.display = "none";

          if (evt.isRecruiting && !evt.hasJoined) {
            els.joinGroup.style.display = "block";
            document.getElementById("joinNameInput").value = "";
          }
        }
      } else {
        els.title.textContent = "新しい予定を追加";
        els.event.value = "";
        els.place.value = "";
        els.memo.value = "";
        els.recruiting.checked = true;
      }

      updateRecruitingLabel();
      document.getElementById("modal").classList.add("active");
    }

    function openAddModal() {
      openModal(formatDate(new Date()), null);
    }

    function closeModal() {
      document.getElementById("modal").classList.remove("active");
    }

    function handleModalOverlayClick(e) {
      if (e.target.id === 'modal') {
        closeModal();
      }
    }

    /* =========================
       保存・参加・削除
    ========================= */
    function saveEvent() {
      const eventVal = document.getElementById("eventInput").value.trim();
      const placeVal = document.getElementById("placeInput").value.trim();
      const memoVal = document.getElementById("memoInput").value.trim();
      const isRecruiting = document.getElementById("recruitingInput").checked;

      if (!eventVal) {
        alert("予定を入力してください。");
        return;
      }

      if (!events[selectedDate]) events[selectedDate] = [];

      if (currentEventId) {
        const evt = events[selectedDate].find(e => e.id === currentEventId);
        if (evt && evt.owner === "自分") {
          evt.event = eventVal;
          evt.place = placeVal;
          evt.memo = memoVal;
          evt.isRecruiting = isRecruiting;
        }
      } else {
        events[selectedDate].push({
          id: generateId(),
          owner: "自分",
          event: eventVal,
          place: placeVal,
          memo: memoVal,
          isRecruiting: isRecruiting,
          members: ["自分"],
          hasJoined: true
        });
      }

      saveData();
      closeModal();
      renderCalendar();
    }

    function joinEvent() {
      const name = document.getElementById("joinNameInput").value.trim();
      if (!name) {
        alert("参加するあなたの名前を入力してください。");
        return;
      }

      const dayEvents = events[selectedDate] || [];
      const evt = dayEvents.find(e => e.id === currentEventId);

      if (evt) {
        evt.members.push(name);
        evt.hasJoined = true;
        saveData();
        closeModal();
        renderCalendar();
        
        setTimeout(() => alert(`${evt.owner} さんの予定に参加しました！`), 100);
      }
    }

    function deleteEvent() {
      if (!currentEventId) return;

      if (confirm("この予定を削除しますか？")) {
        events[selectedDate] = events[selectedDate].filter(e => e.id !== currentEventId);
        
        if (events[selectedDate].length === 0) {
          delete events[selectedDate];
        }

        saveData();
        closeModal();
        renderCalendar();
      }
    }

    /* =========================
       初期起動処理
    ========================= */
    initData();
    renderCalendar();

  </script>

</body>

</html>
